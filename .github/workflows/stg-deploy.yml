name: Deploy flow-crm staging

on:
  push:
    branches:
      - stg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-crm-stg-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Verify Doppler project
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler secrets --only-names

      - name: Build on flow-crm-stg droplet
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          STG_BRANCH: ${{ github.ref_name }}
          APP_DIR: /opt/flow-crm
        with:
          host: ${{ vars.STG_HOST }}
          username: ${{ vars.STG_USER }}
          key: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN,STG_BRANCH,APP_DIR
          timeout: 2m
          command_timeout: 180m
          script: |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:make-it-flow/flow-crm.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --prune origin
            git checkout "$STG_BRANCH"
            git reset --hard "origin/$STG_BRANCH"
            bash scripts/stg-deploy.sh
