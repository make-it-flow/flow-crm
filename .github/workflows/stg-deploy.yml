name: Deploy flow-crm staging

on:
  push:
    branches:
      - stg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-crm-stg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Verify Doppler project
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler secrets --only-names

      - name: Copy deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.STG_HOST }}
          username: ${{ vars.STG_USER }}
          key: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          source: scripts/stg-deploy.sh
          target: /tmp
          strip_components: 1

      - name: Build on flow-crm-stg droplet
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          STG_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ vars.STG_HOST }}
          username: ${{ vars.STG_USER }}
          key: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN,STG_BRANCH
          command_timeout: 180m
          script: |
            chmod +x /tmp/stg-deploy.sh
            /tmp/stg-deploy.sh
